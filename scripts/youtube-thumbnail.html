<!doctype html>
<!-- YouTube thumbnail (1280×720). Render: node scripts/render-cover.mjs -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tideover thumbnail</title>
<style>
  @font-face { font-family: Inter; src: url(../app/assets/fonts/Inter-SemiBold.otf); font-weight: 600; }
  @font-face { font-family: Inter; src: url(../app/assets/fonts/Inter-Bold.otf); font-weight: 700; }
  @font-face { font-family: InterDisplay; src: url(../app/assets/fonts/InterDisplay-ExtraBold.otf); font-weight: 800; }
  :root { --teal: #0E7C66; --teal-dark: #0A5C4C; --sun: #F2B33D; --paper: #F6F4EF; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body { background: linear-gradient(135deg, var(--teal) 0%, var(--teal-dark) 100%); font-family: Inter, sans-serif; color: #fff; position: relative; }
  .brand { position: absolute; left: 64px; top: 52px; display: flex; align-items: center; gap: 16px; }
  .brand span { font-family: InterDisplay; font-weight: 800; font-size: 40px; letter-spacing: -0.5px; }
  h1 { position: absolute; left: 64px; top: 150px; width: 700px; font-family: InterDisplay; font-weight: 800; font-size: 122px; line-height: 0.96; letter-spacing: -3.5px; text-shadow: 0 6px 24px rgba(0,0,0,0.22); }
  h1 em { font-style: normal; color: var(--sun); }
  .tag { position: absolute; left: 64px; bottom: 56px; display: flex; gap: 12px; }
  .tag div { background: rgba(255,255,255,0.16); border: 2px solid rgba(255,255,255,0.35); border-radius: 999px; padding: 12px 22px; font-size: 26px; font-weight: 700; white-space: nowrap; }
  .phone { position: absolute; right: 92px; top: 54px; width: 320px; padding: 11px; background: #0d1412; border-radius: 52px; box-shadow: 0 40px 80px rgba(0,0,0,0.4); transform: rotate(3deg); }
  .phone img { display: block; width: 100%; border-radius: 42px; }
  .badge { position: absolute; right: 36px; bottom: 70px; background: #fff; color: #14211D; border-radius: 24px; padding: 16px 26px; box-shadow: 0 18px 40px rgba(0,0,0,0.25); display: flex; align-items: center; gap: 14px; }
  .badge .dot { width: 46px; height: 46px; border-radius: 50%; background: #E2F1EC; display: grid; place-items: center; }
  .badge b { display: block; font-size: 34px; font-weight: 700; line-height: 1.1; }
  .badge small { font-size: 20px; color: #5B6B66; font-weight: 600; }
</style>
</head>
<body>
  <div class="brand">
    <svg width="56" height="56" viewBox="0 0 100 100" aria-hidden="true">
      <rect width="100" height="100" rx="30" fill="#fff"/>
      <g fill="none" stroke="#0E7C66" stroke-width="8.5" stroke-linecap="round">
        <path d="M22 40 C36 28 50 52 64 40 Q71 34 78 40"/>
        <path d="M22 60 C36 48 50 72 64 60 Q71 54 78 60"/>
      </g>
    </svg>
    <span>Tideover</span>
  </div>
  <h1>Cash in <em>minutes</em>, not months.</h1>
  <div class="tag"><div>AI proposes</div><div>People decide</div><div>PayPal pays</div></div>
  <div class="phone"><img src="../docs/screenshots/apply-paid.jpg" alt=""></div>
  <div class="badge">
    <div class="dot"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="#0E7C66" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div><b>$380 sent</b><small>via PayPal Payouts</small></div>
  </div>
</body>
</html>
