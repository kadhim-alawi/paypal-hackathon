name: CI

on:
  push:
  pull_request:

jobs:
  server:
    name: Server (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  aggrid:
    name: AG Grid bundle for the Ledger
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/aggrid
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/aggrid/package-lock.json
      - run: npm ci
      - run: OUT=/tmp/aggrid.js npm run build

  app:
    name: Flutter app (analyze, tests, web build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn --no-wasm-dry-run
